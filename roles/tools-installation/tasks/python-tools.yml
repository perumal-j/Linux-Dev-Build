- name: "Check if updog exists"
  stat:
    path: "/usr/local/bin/updog"
  register: "updog_exists"
  changed_when: false

- name: "Check if uploadserver exists"
  stat:
    path: "/usr/local/bin/uploadserver"
  register: "uploadserver"
  changed_when: false

# - name: "Check if wsgidav exists"
#   stat:
#     path: "/usr/local/bin/wsgidav"
#   register: "wsgidav"
#   changed_when: false

- name: "Ensure temporary bin directory exists"
  file:
    path: "{{ temp_bin_dir }}"
    state: directory
    mode: '0755'

- name: "Installing Updog, uploadserver, wsgidav via UV"
  shell:
    cmd: "uv tool install {{ item }}"
  environment:
    UV_TOOL_BIN_DIR: "{{ temp_bin_dir }}"
  loop: "{{ UVtools }}"
  when: not updog_exists.stat.exists or not uploadserver.stat.exists #or not wsgidav.stat.exists

- name: "Find all generated executables in temporary directory"
  find:
    paths: "{{ temp_bin_dir }}"
    file_type: any
  register: found_files

- name: "Move executables to /usr/local/bin with root privileges"
  copy:
    src: "{{ item.path }}"
    dest: "{{ target_bin_dir }}/{{ item.path | basename }}"
    remote_src: true
    mode: 0755
    owner: "{{ ansible_facts['env']['USER'] }}"
    group: "{{ ansible_facts['env']['USER'] }}"
  loop: "{{ found_files.files }}"
  become: true
  become_method: sudo

- name: "Clean up temporary bin directory"
  file:
    path: "{{ temp_bin_dir }}"
    state: absent

- name: "Upgrading all UV tools"
  shell:
    cmd: "uv tool upgrade --all"
  changed_when: false

